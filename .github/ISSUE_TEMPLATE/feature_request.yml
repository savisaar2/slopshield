name: Feature Request
description: Propose a new feature, scanner, or ecosystem for SlopShield
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make SlopShield better? We'd love to hear it!
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      placeholder: What would you like to see added?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Problem Statement
      placeholder: Why is this feature needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Proposed Implementation (Optional)
      placeholder: If you have an idea of how to build this, let us know!
